# Blueprint — SPA rewrite for React Router on Render static hosting.
# Dashboard equivalent: Redirects/Rewrites → Source /* → /index.html → Rewrite
services:
  - type: web
    name: laje-signature-web
    runtime: static
    branch: main
    buildCommand: yarn install && yarn build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_SERVER_URL
        value: https://laje-signature-api.onrender.com
      - key: NODE_VERSION
        value: '20'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
